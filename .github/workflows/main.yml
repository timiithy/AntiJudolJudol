name: CI - Anti Judol Judol Club

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build-backend:
    name: Build & Test Backend (Node.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies (Backend)
        working-directory: ./backend 
        run: npm install

      - name: Run tests (Backend)
        working-directory: ./backend
        run: npm test


  build-frontend:
    name: Build & Test Frontend (Node.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies (Frontend)
        working-directory: ./frontend  
        run: npm install

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

  build-ai:
    name: Build & Test AI (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('ai/requirements.txt') }}

      - name: Install dependencies (AI)
        working-directory: ./ai
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Copy test file
        run: |
          mkdir -p ./ai/tests
          cp .github/tests/test_ai.py ./ai/tests/test_ai.py

      - name: Run tests (AI)
        working-directory: ./ai
        run: python -m pytest tests/test_ai.py -v